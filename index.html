<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>audio player</title>

<style>
*{box-sizing:border-box}
html,body{height:100%}

body{
margin:0;
font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
background:linear-gradient(135deg,#141414,#1e1e2f);
color:#fff;
display:flex;
flex-direction:column;
align-items:center;
padding-top:60px;
min-height:100vh;
overflow:auto
}

#titleWrapper{
text-align:center;
cursor:pointer;
user-select:none;
margin-bottom:18px
}

#mainTitle{
font-size:2.2rem;
letter-spacing:1px;
margin:0;
max-width:1000px;
padding:0 16px;
transition:color .18s ease,transform .18s ease
}

#mainTitle:hover{
color:#bfaaff;
transform:scale(1.01)
}

#titleQuote{
font-size:.85rem;
color:#aaa;
margin-top:4px
}

.search-box{
display:flex;
align-items:center;
background:#222;
border-radius:50px;
padding:6px 10px;
width:90%;
max-width:560px;
box-shadow:0 8px 18px rgba(0,0,0,.45)
}

.search-box input{
flex:1;
padding:14px 18px;
border:none;
outline:none;
background:transparent;
color:#fff;
font-size:1rem;
border-radius:40px
}

.search-box button{
margin-left:10px;
background:#6c63ff;
border:none;
color:white;
padding:10px 18px;
border-radius:28px;
cursor:pointer;
box-shadow:0 6px 0 rgba(0,0,0,.35);
font-weight:600;
transition:background .15s ease,transform .12s ease
}

.search-box button:hover{
background:#574ede;
transform:translateY(-1px)
}

#player-section{
margin-top:18px;
width:90%;
max-width:560px;
background:#1c1c2a;
border-radius:14px;
padding:18px;
box-shadow:0 10px 30px rgba(0,0,0,.45);
display:flex;
flex-direction:column;
align-items:center;
gap:10px
}

#nowPlaying{display:none;color:#ddd;text-align:center}
#pauseBtn{display:none;background:#6c63ff;border:none;color:white;padding:8px 14px;border-radius:20px;cursor:pointer}
#seekBar{display:none;width:100%;height:6px;appearance:none;background:#333;border-radius:8px;outline:none}

#seekBar::-webkit-slider-thumb{
appearance:none;
width:12px;
height:12px;
background:#6c63ff;
border-radius:50%
}

#timeDisplay{
display:none;
width:100%;
font-size:.9rem;
color:#bbb;
justify-content:space-between
}

.results{
margin-top:28px;
display:flex;
flex-direction:column;
width:90%;
max-width:700px;
gap:12px
}

.result-item{
background:#1f1f2f;
border-radius:12px;
padding:10px;
display:flex;
gap:12px;
align-items:center;
cursor:pointer;
transition:background .14s ease,transform .12s ease;
box-shadow:0 6px 18px rgba(0,0,0,.35)
}

.result-item:hover{
background:#2a2a3f;
transform:translateY(-2px)
}

.result-item img{
width:56px;
height:56px;
border-radius:10px;
object-fit:cover
}

.info{
display:flex;
flex-direction:column;
gap:6px
}

.info strong{font-size:1rem;color:#fff}
.info span{color:#aaa;font-size:.9rem}

.disclaimer{
position:fixed;
right:16px;
bottom:8px;
color:#777;
font-size:.76rem;
text-align:right
}

@media (max-width:520px){
#mainTitle{font-size:1.4rem;padding:0 12px}
.search-box input{padding:12px}
}
</style>
</head>

<body>

<div id="titleWrapper">
<h1 id="mainTitle">DSD256 Music Player — Music Search</h1>
<div id="titleQuote"></div>
</div>

<div class="search-box">
<input id="query" type="text" placeholder="Search for a song..." />
<button id="search">Search</button>
</div>

<div id="player-section">
<div id="nowPlaying"></div>
<button id="pauseBtn">⏸ Pause</button>
<input type="range" id="seekBar" value="0" min="0" max="100"/>
<div id="timeDisplay"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
</div>

<div id="results" class="results"></div>
<div id="player"></div>

<div class="disclaimer">
© 2025 DSD256 — Music Search — audio streamed via YouTube API.
</div>

<script>
const YT_API_KEY="AIzaSyDkXj66lPy0lC7sRrGfXzFk7dww0c_jkg0"

const TITLE_QUOTES=[
"click me!",
"Jerry L is W",
"don't fail your classes",
"hello",
"press ctrl+shift+qq",
"pin oak pmo",
"not my prob if you get caught",
"please don't block this site",
"this site kinda goes hard ngl",
"spotify so bunz"
]

const titleQuoteEl=document.getElementById("titleQuote")
const titleWrapper=document.getElementById("titleWrapper")

function pickRandom(arr,avoid){
if(!arr.length)return""
if(arr.length===1)return arr[0]
let idx
do{idx=Math.floor(Math.random()*arr.length)}while(arr[idx]===avoid)
return arr[idx]
}

;(function(){
titleQuoteEl.textContent=pickRandom(TITLE_QUOTES,null)
})()

titleWrapper.addEventListener("click",()=>{
const next=pickRandom(TITLE_QUOTES,titleQuoteEl.textContent)
titleQuoteEl.textContent=next
titleWrapper.style.transform="scale(1.02)"
setTimeout(()=>titleWrapper.style.transform="",140)
})

const searchBtn=document.getElementById("search")
const queryInput=document.getElementById("query")
const resultsDiv=document.getElementById("results")

const nowPlaying=document.getElementById("nowPlaying")
const pauseBtn=document.getElementById("pauseBtn")
const seekBar=document.getElementById("seekBar")
const currentTimeEl=document.getElementById("currentTime")
const totalTimeEl=document.getElementById("totalTime")
const timeDisplay=document.getElementById("timeDisplay")

let ytPlayer=null
let isPaused=false
let updateInterval=null

async function searchYouTube(query){
resultsDiv.innerHTML=`<div style="color:#aaa;padding:12px">Searching for "${query}"…</div>`
const url=`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=8&q=${encodeURIComponent(query)}&key=${YT_API_KEY}`

const res=await fetch(url)
const data=await res.json()

resultsDiv.innerHTML=""

data.items.forEach(item=>{
const vid=item.id.videoId
const title=item.snippet.title
const channel=item.snippet.channelTitle
const thumb=item.snippet.thumbnails.medium.url

const div=document.createElement("div")
div.className="result-item"

div.innerHTML=`
<img src="${thumb}">
<div class="info">
<strong>${title}</strong>
<span>${channel}</span>
</div>
`

div.onclick=()=>playAudio(vid,title,channel)

resultsDiv.appendChild(div)
})
}

function playAudio(videoId,title,channel){
nowPlaying.style.display="block"
pauseBtn.style.display="inline-block"
seekBar.style.display="block"
timeDisplay.style.display="flex"

nowPlaying.textContent=`🎧 Now Playing: ${title} — ${channel}`

if(ytPlayer){
ytPlayer.loadVideoById(videoId)
}else{
ytPlayer=new YT.Player("player",{
height:"0",
width:"0",
videoId:videoId,
playerVars:{autoplay:1,controls:0,disablekb:1},
events:{
onReady:e=>{
e.target.playVideo()
startUpdatingSeekBar()
},
onStateChange:handleStateChange
}
})
}

startUpdatingSeekBar()
}

function handleStateChange(event){
if(event.data===YT.PlayerState.PLAYING){
startUpdatingSeekBar()
isPaused=false
pauseBtn.textContent="⏸ Pause"
}else if(event.data===YT.PlayerState.PAUSED){
clearInterval(updateInterval)
isPaused=true
pauseBtn.textContent="▶️ Resume"
}
}

function startUpdatingSeekBar(){
clearInterval(updateInterval)

updateInterval=setInterval(()=>{
if(!ytPlayer)return

const cur=ytPlayer.getCurrentTime()
const dur=ytPlayer.getDuration()

if(dur>0){
seekBar.value=(cur/dur)*100
currentTimeEl.textContent=formatTime(cur)
totalTimeEl.textContent=formatTime(dur)
}

},400)
}

seekBar.oninput=()=>{
const dur=ytPlayer.getDuration()
ytPlayer.seekTo((seekBar.value/100)*dur,true)
}

pauseBtn.onclick=()=>{
if(isPaused){
ytPlayer.playVideo()
pauseBtn.textContent="⏸ Pause"
isPaused=false
}else{
ytPlayer.pauseVideo()
pauseBtn.textContent="▶️ Resume"
isPaused=true
}
}

function formatTime(sec){
const m=Math.floor(sec/60)
const s=Math.floor(sec%60).toString().padStart(2,"0")
return`${m}:${s}`
}

searchBtn.onclick=()=>{
const q=queryInput.value.trim()
if(!q)return
searchYouTube(q)
}

queryInput.addEventListener("keydown",e=>{
if(e.key==="Enter")searchBtn.click()
})

;(function(){
const s=document.createElement("script")
s.src="https://www.youtube.com/iframe_api"
document.body.appendChild(s)
})()
</script>

</body>
</html>
